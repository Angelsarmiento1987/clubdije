name: Actualizar catálogo y publicar
on:
  schedule:
    - cron: '23 11 1 * *' # Día 1 de cada mes, 08:23 Argentina (UTC-3)
  workflow_dispatch:
    inputs:
      publication:
        description: 'Elegí si querés actualizar desde Mercado Libre antes de publicar'
        type: choice
        default: catalogo-y-web
        options:
          - catalogo-y-web
          - solo-web
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: catalogo-pages
  cancel-in-progress: false
jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: github.event_name == 'schedule' || inputs.publication == 'catalogo-y-web'
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
        if: github.event_name == 'schedule' || inputs.publication == 'catalogo-y-web'
      - name: Leer publicaciones (si falla, no altera la web publicada)
        if: github.event_name == 'schedule' || inputs.publication == 'catalogo-y-web'
        run: python scripts/actualizar_catalogo.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Guardar catálogo en el repositorio
        if: github.event_name == 'schedule' || inputs.publication == 'catalogo-y-web'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/productos.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar catálogo mensual [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
